# DEPLOY + SMOKE TEST + AUTO-ROLLBACK
# Every push to main is tested, deployed to GitHub Pages ("production" for this sandbox),
# then smoke-tested. If the smoke test fails, the commit is reverted, which redeploys the previous version.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && pytest -q
      - run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: production
      url: ${{ steps.pages.outputs.page_url }}
    outputs:
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check production serves this commit
        env:
          URL: ${{ needs.deploy.outputs.url }}
        run: |
          want=$(echo "$GITHUB_SHA" | cut -c1-7)
          for i in $(seq 1 12); do
            body=$(curl -fsS "${URL%/}/health.txt?nocache=$RANDOM" || true)
            echo "attempt $i: $body"
            case "$body" in ok*"$want"*) echo "✅ production is healthy on $want"; exit 0 ;; esac
            sleep 10
          done
          echo "❌ production did not report $want"; exit 1

  rollback:
    needs: smoke
    # Only when the smoke test itself failed, and never revert a revert (prevents a rollback loop).
    if: failure() && needs.smoke.result == 'failure' && !startsWith(github.event.head_commit.message, 'Revert')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Get agent identity (GitHub App token)
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - name: Act as the agent bot
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          echo "GH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          uid=$(GH_TOKEN="$TOKEN" gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          echo "AGENT_NAME=${SLUG}[bot]" >> "$GITHUB_ENV"
          echo "AGENT_EMAIL=${uid}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 2
      - name: Open a revert PR and auto-merge it (CI must still pass)
        run: |
          git config user.name "$AGENT_NAME"
          git config user.email "$AGENT_EMAIL"
          branch="revert/${GITHUB_SHA:0:7}"
          git checkout -b "$branch"
          git revert --no-edit "$GITHUB_SHA"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Auto-rollback: revert ${GITHUB_SHA:0:7}" \
            --body "Smoke test failed after deploying $GITHUB_SHA. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh pr merge "$branch" --auto --squash
          gh issue create --title "Auto-rollback of ${GITHUB_SHA:0:7}" --label needs-human \
            --body "Smoke test failed after deploying $GITHUB_SHA; a revert PR was opened and set to auto-merge."
