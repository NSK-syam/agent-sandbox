# CODER AGENT
# Trigger: add the label `agent:build` to an issue.
# Result: a branch `agent/issue-<n>-<run>` and a PR with auto-merge enabled.
name: Coder agent

on:
  issues:
    types: [labeled]

concurrency:
  group: coder-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  code:
    if: github.event.label.name == 'agent:build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # Pushes and PRs are made with this PAT so they trigger CI and the reviewer.
      # (Events created with the default GITHUB_TOKEN never trigger other workflows.)
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_GH_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt

      - name: Prepare branch and inputs
        run: |
          git config user.name "coder-agent"
          git config user.email "coder-agent@users.noreply.github.com"
          git checkout -b "agent/issue-${ISSUE}-${GITHUB_RUN_ID}"
          mkdir -p .agent
          gh issue view "$ISSUE" --json number,title,body \
            --template '# Issue #{{.number}}: {{.title}}{{"\n\n"}}{{.body}}{{"\n"}}' > .agent/issue.md
          gh issue comment "$ISSUE" --body "🤖 Coder agent picked this up: $RUN_URL"

      - name: Load prompt
        id: prompt
        run: |
          {
            echo "text<<PROMPT_EOF"
            cat .github/agents/coder.md
            echo
            echo "The issue number is ${ISSUE}."
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run coder agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git *),Bash(gh pr create *),Bash(gh pr merge *),Bash(gh issue comment *),Bash(pytest *),Bash(ruff *),Bash(python *)"

      - name: Report failure on the issue
        if: failure()
        run: |
          gh issue comment "$ISSUE" --body "❌ Coder agent failed. Logs: $RUN_URL"
